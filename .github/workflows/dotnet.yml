name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore SerialCommunications.slnx

    - name: Build
      run: dotnet build SerialCommunications.slnx --configuration Release --no-restore

    - name: Test
      run: dotnet test SerialCommunications.slnx --configuration Release --no-build
